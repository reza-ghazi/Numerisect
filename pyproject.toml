[project]
name = "numerisect"
version = "0.2.0"
description = "Multi-Engine Integer Factorization and Prime Analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
numerisect = "numerisect.main:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["numerisect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
