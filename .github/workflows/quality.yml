name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight native test prerequisites
        run: |
          # The hosted runner image ships third-party apt sources that this project
          # does not use. On 2026-09-09 Google's Chrome repository served an index whose
          # hash did not match its Release file, so apt-get update exited non-zero and
          # took the whole build with it. Every package below comes from the Ubuntu
          # archives, so drop those sources rather than depend on their availability.
          # Ubuntu 24.04 uses deb822 ".sources" files as well as legacy ".list" ones, so
          # match on the host the entry points at rather than on a file name.
          sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install --yes pari-gp libflint-dev libgmp-dev libmpfr-dev libprimesieve-dev pkg-config gcc primesieve gmp-ecm autoconf automake libtool shellcheck
      - name: Install project test dependencies
        run: python -m pip install '.[test,dev]'
      - name: Run Python tests
        run: pytest -q

  quality:
    name: Lint, shell, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation tools
        run: |
          # The hosted runner image ships third-party apt sources that this project
          # does not use. On 2026-09-09 Google's Chrome repository served an index whose
          # hash did not match its Release file, so apt-get update exited non-zero and
          # took the whole build with it. Every package below comes from the Ubuntu
          # archives, so drop those sources rather than depend on their availability.
          # Ubuntu 24.04 uses deb822 ".sources" files as well as legacy ".list" ones, so
          # match on the host the entry points at rather than on a file name.
          sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          # pari-gp is here so the wheel smoke test can compute rather than only import.
          sudo apt-get install --yes shellcheck pari-gp
          python -m pip install '.[test,dev]'
      - name: Lint Python
        run: ruff check .
      - name: Type-check localhost security boundary
        run: mypy
      - name: Validate shell scripts
        run: shellcheck install.sh run.sh
      - name: Validate browser JavaScript
        run: node --check numerisect/static/app.js
      - name: Build source and wheel distributions
        run: python -m build
      - name: Inspect and install wheel in a fresh environment
        run: |
          python -m zipfile --list dist/numerisect-*.whl
          python -m venv /tmp/numerisect-wheel-smoke
          /tmp/numerisect-wheel-smoke/bin/pip install dist/numerisect-*.whl
          /tmp/numerisect-wheel-smoke/bin/python scripts/check_installed_distribution.py
