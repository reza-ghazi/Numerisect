name: Bug report
description: Report a reproducible Numerisect defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include session tokens, secrets, full logs, databases, or personal filesystem paths. Report security issues privately as described in SECURITY.md."
  - type: input
    id: revision
    attributes:
      label: Numerisect revision
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options: ["Linux", "Windows WSL", "macOS", "Other"]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include minimal redacted reproduction steps and expected behavior.
    validations:
      required: true
  - type: textarea
    id: engines
    attributes:
      label: Relevant native engines
      description: List engine names and versions without executable paths.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, session tokens, personal paths, databases, and sensitive logs.
          required: true
        - label: This is not a private security report.
          required: true
